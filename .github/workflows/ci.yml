name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm run test
      - name: tarball carries what the bins point at
        # `bin` resolves at install time on the consumer's machine; a missing
        # entrypoint is a broken `npx memcell`, not a failed publish.
        run: |
          set -euo pipefail
          test -f dist/bin.js
          test -f dist/index.js
          npm pack --dry-run --json > /tmp/pack.json
          grep -q '"dist/bin.js"' /tmp/pack.json
